[rule]
id = "no-ssh-subprocess"
description = "Disallow subprocess.* calls that invoke ssh; use shared helpers instead"
severity = "error"

[match]
# resharp (RE#) rejects lazy quantifiers (`*?`); use greedy `[^)]*`.
pattern = "subprocess\\.(Popen|run|call|check_call|check_output)\\([^)]*ssh[^)]*\\)"
languages = ["python"]
