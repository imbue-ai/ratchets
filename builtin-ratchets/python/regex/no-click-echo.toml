[rule]
id = "no-click-echo"
description = "Do not use click.echo. Use logger.info() instead"
severity = "warning"

[match]
# resharp (RE#) rejects `\b` immediately after a star, so the trailing word
# boundary after `.*` is expressed as a lookahead.
pattern = "\\bclick\\.echo\\b|\\bfrom\\s+click\\s+import\\s+.*echo(?=\\W|\\z)"
languages = ["python"]
